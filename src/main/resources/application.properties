spring.application.name=mediaStreamer

# MinIo Configuration
minio.url=http://localhost:9000

# MinIo Configuration
minio.access-key=myminiouser
minio.secret-key=myminiopassword

#MinIo Bucket Configuration
minio.video.bucket=videos
minio.video.metadata.bucket=video-metadata

# Sets the max size for a single file. For example, 50MB.
spring.servlet.multipart.max-file-size=10GB
# Sets the max size for the entire request. For example, 50MB.
spring.servlet.multipart.max-request-size=10GB
